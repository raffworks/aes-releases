name: Publish AES v12.9 desktop TEST prerelease
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-aes-v12-9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARCHIVE_URL: >-
        https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-52f8-8206-b9c2-b9384598fefa/raw?se=2026-10-31T14%3A01%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=197c7bae-4baf-5c1f-871d-43e6adc4254c&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T01%3A53%3A25Z&ske=2026-11-01T01%3A53%3A25Z&sks=b&skv=2026-02-06&sig=4N8trCuDiT5CrH64xQ2rAnlnyFf3AJUm2jHYFDf8%2BPg%3D
      EXPECTED_EXE_SHA256: 94612841d7ef49342a33a5e3bda3bc677427c276d029df08780ec2c79024ab28
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download verified Windows v12.9 build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 25 --max-time 180 --output aes-v12.9.zip "$ARCHIVE_URL"
          unzip -q aes-v12.9.zip -d dist
          test -s dist/AutomatedEmailSender.exe
          test -s dist/SHA256SUMS.txt
      - name: Validate executable and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          actual=$(sha256sum AutomatedEmailSender.exe | cut -d' ' -f1)
          test "$actual" = "$EXPECTED_EXE_SHA256"
          file AutomatedEmailSender.exe
          python - <<'PY'
          from pathlib import Path
          exe=Path("AutomatedEmailSender.exe")
          assert exe.stat().st_size == 48641619, "EXE size mismatch"
          assert exe.open("rb").read(2) == b"MZ", "Invalid Windows binary"
          print("AES v12.9 binary verified:",exe.stat().st_size,"bytes")
          PY
      - name: Create tagged prerelease for testing (not latest stable)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aes-release-notes.md <<'EOF'
          AES v12.9 — Unified Backend connection update

          **TESTING PRERELEASE.** Windows x64 executable; backend endpoint migrated to https://aes-backend-ckmy.onrender.com.

          - Desktop license API: /validate
          - Trial registration API: /api/trial/register
          - Improved backend connection errors and paid recipient-limit wording
          - Built on Windows 2022 with Python 3.11 and PyInstaller
          - SHA256: 94612841d7ef49342a33a5e3bda3bc677427c276d029df08780ec2c79024ab28

          Test application UI, license activation, trial registration and email delivery before treating v12.9 as the production update.
          The production auto-update advertised version stays v12.8 during testing.
          EOF
          gh release create "v12.9" dist/AutomatedEmailSender.exe dist/SHA256SUMS.txt --repo "raffworks/aes-releases" --title "AES v12.9 — Unified Backend (Testing)" --notes-file /tmp/aes-release-notes.md --prerelease
