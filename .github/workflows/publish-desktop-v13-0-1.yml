name: Publish AES Desktop v13.0.1
on:
  push:
    paths:
      - .github/workflows/publish-desktop-v13-0-1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download verified Windows artifact (time-limited release transfer)
        env:
          ARTIFACT_TRANSFER_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-59ec-8211-aca2-22d7aa97c71c/raw?se=2026-11-17T06%3A31%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=dbd221c1-2e57-58b2-9d87-2b5d25207290&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T03%3A56%3A23Z&ske=2026-11-18T03%3A56%3A23Z&sks=b&skv=2026-06-06&sig=Xnb%2BSwXKtlH0tgitaxCmYxolWZzYQkwVb2feFR9Xm9w%3D"
        run: |
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 200 --silent --show-error \
            "$ARTIFACT_TRANSFER_URL" --output release.zip
          unzip -o release.zip AutomatedEmailSender.exe SHA256SUMS.txt
          echo "53b477201b6ed69478a52dad69507b8b2b2683edbffef7209782c6f56f7b3bf4  AutomatedEmailSender.exe" | sha256sum --check
          sha256sum --check SHA256SUMS.txt
          test "$(stat -c %s AutomatedEmailSender.exe)" -eq 48633275
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v13.0.1 AutomatedEmailSender.exe SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "AES v13.0.1 - SMTP Timeout Reliability" \
            --notes "AES Desktop v13.0.1 patch release. SMTP socket timeout raised from 30 to 60 seconds to better tolerate slower network connections. No change to retry policy, provider limits or uncertain-delivery safeguards. Windows x64 portable EXE (unsigned). SHA256: 53b477201b6ed69478a52dad69507b8b2b2683edbffef7209782c6f56f7b3bf4. Source: raffworks/AES commit abc989ddfa0a19ec4a4290ab72ff253fd047b8e9. Delivery under Gmail restrictions is not guaranteed." \
            --latest
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v13.0.1 --repo "${{ github.repository }}" --json tagName,isLatest,assets --jq '{tag: .tagName, latest: .isLatest, assets: [.assets[].name]}'
