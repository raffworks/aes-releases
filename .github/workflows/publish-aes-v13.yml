name: Publish AES v13 verified Windows release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-aes-v13.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIVE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-90cc-8206-a243-6f8c6b30e1a4/raw?se=2026-10-31T17%3A55%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=0968b677-0c59-557f-bf8c-adec6f518cb8&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T01%3A51%3A54Z&ske=2026-11-01T01%3A51%3A54Z&sks=b&skv=2026-02-06&sig=D0TsM2lTQzOiHk1E5dnkYVQU7IZZ%2BnJBf64qVUMFWP8%3D'
      SHA256_EXPECTED: ce0598dc06da0e921f89b5d0defbe1a634c92c69691bc39399e94da7acdd6f50
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download verified build and validate before any release changes
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 25 --max-time 240 -o aes-v13.zip "$ARCHIVE_URL"
          mkdir dist
          unzip -q aes-v13.zip -d dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$(sha256sum dist/AutomatedEmailSender.exe | cut -d' ' -f1)" = "$SHA256_EXPECTED"
          test "$(stat -c %s dist/AutomatedEmailSender.exe)" = "48661125"
          test "$(head -c2 dist/AutomatedEmailSender.exe)" = MZ
          file dist/AutomatedEmailSender.exe
      - name: Remove only the verified empty v13 preparatory draft
        run: |
          set -euo pipefail
          draft_id=430090827
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r .tag_name <<< "$draft")" = v13.0
          test "$(jq -r .draft <<< "$draft")" = true
          test "$(jq '.assets | length' <<< "$draft")" = 0
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_id"
      - name: Create v13 release with two verified assets as prerelease
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## AES v13.0 — Desktop Reliability
          - Windows DPAPI encryption for saved SMTP passwords, with legacy credential migration.
          - SQLite batch journal, Resume Pending Batch, protection against duplicate resends and manual review of uncertain results.
          - Connection Diagnostics with immediate loading, nonactivating license validation, privacy-safe reports and opt-in SMTP login test.
          - License/About cleanup, SMTP transient-error retries, improved updater rollback and RaffWorks Digital Services Windows metadata.
          - Scheduled sending is unchanged.
          
          Windows x64 portable executable. **Unsigned** — SmartScreen warnings may appear.
          SHA-256: ce0598dc06da0e921f89b5d0defbe1a634c92c69691bc39399e94da7acdd6f50
          
          Windows CI passed 19 automated tests and binary metadata checks. Real-device license/Diagnostics checks passed. Full live SMTP batch/resume, DPAPI migration and auto-updater rollback were not exhaustively tested. Keep a backup of v12.9 during upgrade.
          EOF
          gh release create v13.0 dist/AutomatedEmailSender.exe dist/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --title "AES v13.0 - Desktop Reliability" --notes-file notes.md --prerelease
      - name: Re-download GitHub release assets and verify
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download v13.0 -R "$GITHUB_REPOSITORY" -D verified -p AutomatedEmailSender.exe -p SHA256SUMS.txt
          (cd verified && sha256sum --check SHA256SUMS.txt)
          test "$(sha256sum verified/AutomatedEmailSender.exe | cut -d' ' -f1)" = "$SHA256_EXPECTED"
          test "$(stat -c %s verified/AutomatedEmailSender.exe)" = 48661125
      - name: Promote to latest stable only after successful verification
        run: |
          set -euo pipefail
          gh release edit v13.0 -R "$GITHUB_REPOSITORY" --prerelease=false --latest
          test "$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = v13.0
          echo "AES v13.0 latest stable published."
