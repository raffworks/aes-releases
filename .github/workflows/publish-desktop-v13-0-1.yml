name: Verify AES Desktop v13.0.1 Published Release
on:
  push:
    paths:
      - .github/workflows/publish-desktop-v13-0-1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published latest release and download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')"
          test "$latest" = "v13.0.1"
          gh release download v13.0.1 --repo "${{ github.repository }}" --pattern "AutomatedEmailSender.exe" --pattern "SHA256SUMS.txt"
          test "$(stat -c %s AutomatedEmailSender.exe)" -eq 48633275
          echo "53b477201b6ed69478a52dad69507b8b2b2683edbffef7209782c6f56f7b3bf4  AutomatedEmailSender.exe" | sha256sum --check
          sha256sum --check SHA256SUMS.txt
