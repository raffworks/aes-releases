name: Promote AES v12.9 to Stable Release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-aes-v12-9-stable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify existing release assets and checksum
        shell: bash
        run: |
          set -euo pipefail
          gh release download v12.9 -R raffworks/aes-releases -p 'AutomatedEmailSender.exe' -p 'SHA256SUMS.txt' -D /tmp/aes129
          cd /tmp/aes129
          sha256sum --check SHA256SUMS.txt
          actual="$(sha256sum AutomatedEmailSender.exe | awk '{print $1}')"
          test "$actual" = "94612841d7ef49342a33a5e3bda3bc677427c276d029df08780ec2c79024ab28"
          test "$(stat -c %s AutomatedEmailSender.exe)" = "48641619"
          printf 'AES v12.9 verified: %s\n' "$actual"
      - name: Promote v12.9 prerelease to latest stable
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v12.9 -R raffworks/aes-releases --prerelease=false --latest
      - name: Update official release title and changelog
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aes-129-notes.md <<'EOF'
          ## AES v12.9 — Unified Backend

          Stable Windows x64 desktop release of Automated Email Sender.

          ### What's new
          - Connects license activation and verification to the AES Unified Backend.
          - Registers free trials through the unified payment/portal API.
          - Improves reporting of server, HTTP and connectivity errors.
          - Clarifies that paid plans remove AES trial recipient quotas, while email-provider sending limits still apply.
          - Includes the existing automatic update mechanism with SHA-256 verification.

          ### Verification
          - Windows executable built with Python 3.11 + PyInstaller.
          - Verified SHA-256: `94612841d7ef49342a33a5e3bda3bc677427c276d029df08780ec2c79024ab28`
          - The unified backend health and public API endpoints have passed live connection checks.

          ### Notes
          App-password setup and email delivery are subject to Gmail/Yahoo/SMTP provider requirements. Live Windows GUI, individual license activation, and end-to-end SMTP delivery require user-device testing.
          EOF
          gh release edit v12.9 -R raffworks/aes-releases --title "AES v12.9 - Unified Backend" --notes-file /tmp/aes-129-notes.md --prerelease=false --latest
      - name: Verify latest stable release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v12.9 -R raffworks/aes-releases --json isPrerelease --jq '.isPrerelease')" = "false"
          test "$(gh release view -R raffworks/aes-releases --json tagName --jq '.tagName')" = "v12.9"
          echo "AES v12.9 now latest stable release."
